<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Four IQ context layers around Copilots and agents</title>
  <desc id="desc">Work IQ supplies work context; Foundry IQ supplies organizational knowledge; Web IQ supplies fresh web information; Fabric IQ supplies business entities and data. Access and configuration determine availability.</desc>
  <g font-family="Arial, sans-serif" fill="#1a2c55">
    <path d="M545 230 360 150M855 230l185-80M545 420 360 500M855 420l185 80" fill="none" stroke="#c9d6e3" stroke-width="8"/>
    <circle cx="700" cy="325" r="155" fill="#1a2c55"/>
    <path d="m700 213 18 42 45 18-45 18-18 42-18-42-45-18 45-18Z" fill="#f4911b"/>
    <text x="700" y="365" text-anchor="middle" font-size="36" font-weight="700" fill="white">Copilots</text>
    <text x="700" y="408" text-anchor="middle" font-size="31" fill="white">&amp; agents</text>
    <g transform="translate(65 40)">
      <rect x="0" y="0" width="370" height="205" rx="4" fill="#deebf8"/>
      <circle cx="58" cy="62" r="18" fill="#135894"/><path d="M25 121v-22q33-35 66 0v22" fill="#135894"/>
      <text x="114" y="74" font-size="35" font-weight="700">Work IQ</text>
      <text x="30" y="166" font-size="27">People · work · collaboration</text>
    </g>
    <g transform="translate(965 40)">
      <rect width="370" height="205" rx="4" fill="#deebf8"/>
      <path d="M28 34h40l21 20v69H28Z" fill="white" stroke="#135894" stroke-width="4"/><path d="M40 77h36M40 92h29" stroke="#135894" stroke-width="4"/>
      <text x="111" y="76" font-size="35" font-weight="700">Foundry IQ</text>
      <text x="30" y="166" font-size="27">Organizational knowledge</text>
    </g>
    <g transform="translate(65 395)">
      <rect width="370" height="205" rx="4" fill="#deebf8"/>
      <circle cx="60" cy="74" r="36" fill="none" stroke="#135894" stroke-width="4"/><ellipse cx="60" cy="74" rx="15" ry="36" fill="none" stroke="#135894" stroke-width="3"/><path d="M24 74h72" stroke="#135894" stroke-width="3"/>
      <text x="114" y="85" font-size="35" font-weight="700">Web IQ</text>
      <text x="30" y="166" font-size="27">Fresh web information</text>
    </g>
    <g transform="translate(965 395)">
      <rect width="370" height="205" rx="4" fill="#deebf8"/>
      <path d="M26 40h68v68H26zm0 22h68m-68 23h68M49 40v68m23-68v68" fill="white" stroke="#135894" stroke-width="4"/>
      <text x="114" y="85" font-size="35" font-weight="700">Fabric IQ</text>
      <text x="30" y="166" font-size="27">Business entities &amp; data</text>
    </g>
  </g>
</svg>
