<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Locate the stage that erased a variant conflict</title>
  <desc id="desc">Illustrated failure: extraction sees black in text and red in an image, but reconciliation discards red. A faulty validator accepts the record. The debugging task is to preserve candidates and reject unresolved conflicts. This is not a recorded trace.</desc>
  <g font-family="Arial, sans-serif" fill="#1a2c55">
    <path d="M100 110v385M100 165h75M100 280h225M100 395h375M100 495h525" stroke="#135894" stroke-width="4" fill="none"/>
    <rect x="175" y="115" width="1150" height="90" fill="#deebf8"/>
    <text x="205" y="153" font-size="29" font-weight="700">Extract</text><text x="470" y="170" font-size="29">Text: black · Image: red</text>
    <rect x="325" y="230" width="1000" height="90" fill="#fff0de" stroke="#f4911b" stroke-width="3"/>
    <text x="355" y="268" font-size="29" font-weight="700">Reconcile</text><text x="620" y="285" font-size="29">BUG: red candidate discarded</text>
    <rect x="475" y="345" width="850" height="90" fill="#fff0de"/>
    <text x="505" y="383" font-size="29" font-weight="700">Validate</text><text x="770" y="400" font-size="29">BUG: shape-only check passes</text>
    <rect x="625" y="460" width="700" height="90" fill="#1a2c55"/>
    <text x="655" y="498" fill="white" font-size="29" font-weight="700">Export</text><text x="920" y="515" fill="white" font-size="29">Wrongly accepted</text>
    <text x="700" y="610" text-anchor="middle" font-size="28">Illustrated failure path · inspect actual intermediate records in the live run</text>
  </g>
</svg>
