<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Keep both sides of a source disagreement</title>
  <desc id="desc">A specification says NL-200; a spreadsheet says NL-201. The proposed record keeps both candidates, sets canonical sku to null and routes sku-conflict to human review. The schema must not erase the disagreement.</desc>
  <g font-family="Arial, sans-serif" fill="#1a2c55">
    <rect x="60" y="80" width="510" height="185" fill="#deebf8"/><text x="90" y="128" font-size="28">Specification · model field</text><text x="90" y="205" font-size="53" font-weight="700">NL-200</text>
    <rect x="60" y="320" width="510" height="185" fill="#fff0de"/><text x="90" y="368" font-size="28">Supplier sheet · model cell</text><text x="90" y="445" font-size="53" font-weight="700">NL-201</text>
    <path d="M580 170h60v120h50M580 410h60V290" stroke="#f4911b" stroke-width="5" fill="none"/>
    <rect x="710" y="80" width="630" height="425" fill="#1a2c55"/>
    <g fill="white" font-family="Consolas, monospace" font-size="30">
      <text x="745" y="140">sku: null</text><text x="745" y="205">candidates:</text><text x="780" y="255">NL-200 → spec field</text><text x="780" y="305">NL-201 → sheet cell</text><text x="745" y="380">issue: sku-conflict</text><text x="745" y="445">status: needs_review</text>
    </g>
    <text x="700" y="585" text-anchor="middle" font-size="31" font-weight="700">A plausible value is not a resolved contradiction.</text>
    <text x="700" y="630" text-anchor="middle" font-size="25">Synthetic expected record · retain actual page/cell locators when source files are built</text>
  </g>
</svg>
