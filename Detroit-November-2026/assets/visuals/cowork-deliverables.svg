<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Delegate an outcome; review tangible deliverables</title>
  <desc id="desc">A single Cowork task can work toward documents, presentations, spreadsheet analyses, meeting and email preparation, or an app with the App skill. Availability and action approval depend on the tenant.</desc>
