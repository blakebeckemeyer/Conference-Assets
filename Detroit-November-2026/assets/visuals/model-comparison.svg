<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">A controlled model comparison</title>
  <desc id="desc">The same product facts, retailer rules, instructions and question feed two available models in fresh sessions. Outputs are compared against one scorecard, not ranked by model name.</desc>
  <g font-family="Arial, sans-serif" fill="#1a2c55">
    <path d="M60 153h305v332H60Z" fill="#deebf8"/>
    <text x="92" y="209" font-size="31" font-weight="700">Hold fixed</text>
    <text x="92" y="273" font-size="27">Source facts</text><text x="92" y="319" font-size="27">Task rules</text><text x="92" y="365" font-size="27">Instructions</text><text x="92" y="411" font-size="27">One question</text>
    <path d="M365 318h80V162h88M445 318v159h88" fill="none" stroke="#f4911b" stroke-width="5"/>
    <g stroke="#135894" stroke-width="4" fill="white">
      <path d="M555 83h350v160H555zM555 395h350v160H555z"/>
      <path d="M905 162h84v156h62M905 477h84V318" fill="none" stroke="#f4911b" stroke-width="5"/>
    </g>
    <text x="730" y="149" font-size="34" text-anchor="middle" font-weight="700">Model A</text><text x="730" y="198" font-size="26" text-anchor="middle">Fresh conversation</text>
    <text x="730" y="461" font-size="34" text-anchor="middle" font-weight="700">Model B</text><text x="730" y="510" font-size="26" text-anchor="middle">Fresh conversation</text>
    <rect x="1060" y="153" width="295" height="332" fill="#1a2c55"/>
    <g fill="white">
      <text x="1092" y="209" font-size="31" font-weight="700">Compare</text>
      <text x="1092" y="273" font-size="27">Exact facts</text><text x="1092" y="319" font-size="27">Completeness</text><text x="1092" y="365" font-size="27">Useful next steps</text><text x="1092" y="411" font-size="27">Elapsed time</text>
    </g>
    <text x="700" y="614" font-size="28" text-anchor="middle">Choose for this job—not for the model’s name.</text>
  </g>
</svg>
