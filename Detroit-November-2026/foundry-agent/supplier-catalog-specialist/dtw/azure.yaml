# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: supplier-catalog-specialist-dtw
infra:
    provider: microsoft.foundry
requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0'
services:
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    supplier-catalog-specialist:
        host: azure.ai.agent
        kind: hosted
        language: python
        name: supplier-catalog-specialist
        displayName: Supplier Catalog Specialist DTW
        description: |
            Processes the fixed FC-03-NL300 synthetic source bundle, retains conflicting evidence, and returns a catalog review draft. Never approves or publishes.
        project: src/catalog
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        env:
            PYTHONNOUSERSITE: "1"
            FOUNDRY_AUTH_MODE: managed_identity
            AZURE_TENANT_ID: ${AZURE_TENANT_ID}
            AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-6.1-sol
        agentEndpoint:
            authorizationSchemes:
                - type: AzureRbac
                  isolationKeySource:
                      kind: Entra
                - type: BotServiceRbac
            protocols:
                - activity
        protocols:
            - protocol: activity
              version: 2.0.0
        uses:
            - ai-project
